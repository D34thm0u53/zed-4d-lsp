name = "4D"
grammar = "4D"
path_suffixes = ["4dm"]
line_comments = ["// "]
block_comment = { start = "/* ", prefix = "", end = " */", tab_size = 0 }
autoclose_before = ";:.,=}])>\n\t "
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "/*", end = " */", close = true, newline = false, not_in = ["string", "comment"] },
]
tab_size = 2
hard_tabs = true
word_characters = ["$", "_"]
